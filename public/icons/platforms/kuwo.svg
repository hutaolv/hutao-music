<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 酷我音乐手绘图标：橙色渐变圆角底 + 白色八分音符 -->
  <defs>
    <linearGradient id="kw-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3C"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#kw-g)"/>
  <!-- 音符符头（微倾椭圆） -->
  <ellipse cx="19" cy="33.5" rx="4.6" ry="3.6" fill="#fff" transform="rotate(-18 19 33.5)"/>
  <!-- 符干 -->
  <rect x="22.2" y="14" width="2.6" height="20" rx="1.3" fill="#fff"/>
  <!-- 符尾旗 -->
  <path d="M24.8 14c4.5 1.2 6.8 4.2 6.2 8.6-1.8-2.6-3.8-3.6-6.2-3.4Z" fill="#fff"/>
  <!-- 右上角小高光点，增加灵动 -->
  <circle cx="36.5" cy="11.5" r="1.8" fill="#fff" opacity="0.5"/>
</svg>
